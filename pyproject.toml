[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "flowforge"
version = "0.1.0"
description = "AI-powered browser automation framework"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "FlowForge Contributors"},
]
keywords = ["automation", "browser", "ai", "llm", "playwright", "stealth"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Testing",
    "Topic :: Internet :: WWW/HTTP :: Browsers",
]

dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.5",
    "httpx>=0.27",
    "playwright-core>=1.44",
]

[project.optional-dependencies]
stealth = ["cloakbrowser>=0.1"]
gmail = ["google-api-python-client>=2.100", "google-auth-oauthlib>=1.1"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "mypy>=1.10",
]

[project.scripts]
flowforge = "flowforge.api.server:main"

[project.urls]
Homepage = "https://github.com/Punkrose/FlowForge"
Repository = "https://github.com/Punkrose/FlowForge"
Issues = "https://github.com/Punkrose/FlowForge/issues"
Documentation = "https://github.com/Punkrose/FlowForge#readme"

[tool.setuptools.packages.find]
include = ["flowforge*"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
